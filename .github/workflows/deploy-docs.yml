name: Build & Deploy MEMElang Pure-.meme Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build MEMElang CLI & Package Pure-.meme Docs (--target=web)
        run: |
          make -j$(nproc)
          ./meme package docs/src/App.meme --target=web -o docs/.build
          rm -rf docs/dist
          mv docs/.build/web docs/dist
          rm -rf docs/.build

      - name: Deploy Prebuilt Static Bundle to Vercel (when VERCEL_TOKEN is set)
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" || true
          npx vercel@latest deploy docs/dist --prod --yes --token="$VERCEL_TOKEN"

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

      - name: Deploy to GitHub Pages (optional when Pages enabled)
        if: ${{ vars.ENABLE_GITHUB_PAGES == 'true' }}
        id: deployment
        uses: actions/deploy-pages@v4
